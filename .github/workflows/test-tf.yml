name: Test Terraform

on:
  push:
    branches:
      - 'master'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        # checkout code
      - uses: actions/checkout@v7

        # setup terraform
      - uses: hashicorp/setup-terraform@v4

        # init terraform to the correct state file
      - name: Terraform Init
        run: terraform -chdir="${{github.workspace}}/modules/s3" init -no-color -input=false -backend=false

        # run tests
      - name: Terraform Test
        id: terraform-test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform -chdir="${{github.workspace}}/modules/s3" test -no-color

        # put the terraform test report on the job summary so users don't have to dig through the logs
      - name: Publish Terraform Test Report to Job Summary
        run: echo "${{ steps.terraform-test.outputs.stdout }}" >> $GITHUB_STEP_SUMMARY